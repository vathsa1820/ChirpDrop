<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Concentric Acoustic Wave Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06b6d4" stroke-width="6" opacity="0.25" stroke-dasharray="14 10"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#06b6d4" stroke-width="8" opacity="0.45"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#10b981" stroke-width="10" opacity="0.75" filter="url(#glow)"/>

  <!-- Core Acoustic Signal Waves (Chirp) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Sound Wave Pulses -->
    <path d="M 176 256 L 176 256" stroke="#38bdf8" stroke-width="18"/>
    <path d="M 216 216 L 216 296" stroke="#06b6d4" stroke-width="18"/>
    <path d="M 256 160 L 256 352" stroke="#10b981" stroke-width="20" filter="url(#glow)"/>
    <path d="M 296 200 L 296 312" stroke="#06b6d4" stroke-width="18"/>
    <path d="M 336 240 L 336 272" stroke="#38bdf8" stroke-width="18"/>
  </g>

  <!-- Top Acoustic Drop Dot -->
  <circle cx="256" cy="116" r="10" fill="#38bdf8" filter="url(#glow)"/>
</svg>
